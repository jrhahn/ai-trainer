services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer}
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      # No default. A default here is silently wrong rather than merely
      # insecure: Postgres only applies POSTGRES_PASSWORD when it initialises an
      # empty data directory, so on an existing volume the placeholder is
      # ignored here but still lands in the backend's DATABASE_URL below --
      # the two disagree and the backend crash-loops on "password
      # authentication failed". Fail at `compose up` instead. Copy .env.example
      # to .env for local development.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrainer} -d ${POSTGRES_DB:-aitrainer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  traefik:
    image: traefik:v3.6.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
      # authelia-api uses the AuthRequest implementation which returns 401 (not 302) for
      # unauthenticated requests, preventing cross-origin redirects that cause CORS errors
      # in JavaScript fetch() calls.
      - traefik.http.middlewares.authelia-api.forwardauth.address=http://authelia:9091/api/authz/auth-request
      - traefik.http.middlewares.authelia-api.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authelia-api.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email
      - traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.trainlikea.pro`) || Host(`traefik.train-like-a.pro`)
      - traefik.http.routers.traefik-dashboard-http.entrypoints=web
      - traefik.http.routers.traefik-dashboard-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.traefik-dashboard-https.rule=Host(`traefik.trainlikea.pro`) || Host(`traefik.train-like-a.pro`)
      - traefik.http.routers.traefik-dashboard-https.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard-https.tls=true
      - traefik.http.routers.traefik-dashboard-https.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dashboard-https.service=api@internal
      - traefik.http.routers.traefik-dashboard-https.middlewares=traefik-auth@docker
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      # Response headers for everything served over TLS (#682). The redirect
      # above is permanent but does nothing for the *first* request a browser
      # makes on a new network, which is the one worth protecting; HSTS is what
      # closes that window. includeSubDomains is safe here because every
      # hostname this stack answers on (app, auth, traefik) is already
      # websecure-only. Preload is deliberately off: it is a one-way door
      # enforced by browser vendors, not by this config.
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.stsPreload=false
      # The API is served by Traefik directly, never through the frontend's
      # nginx, so it gets none of nginx.conf's headers. These two are the ones
      # that mean something on a JSON response.
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=no-referrer

  backend:
    build:
      context: ./backend
      args:
        # Must match the owner of ./authelia on the host, because registration
        # writes users_database.yml there through a bind mount and the mount
        # keeps the host's ownership (#682). Exposed as a build arg rather than
        # fixed in the Dockerfile precisely because the right value is a
        # property of the host, not of the image. Check with `ls -lan authelia/`
        # before switching a running deployment: an existing users_database.yml
        # written while the container ran as root is owned by root:root 0600 and
        # has to be chowned too, or registration starts failing.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Must agree with the postgres service above; see the note there on why
      # this password has no default.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitrainer}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-aitrainer}
      # Anything other than development/test makes the backend refuse to boot
      # without SECRETS_ENCRYPTION_KEY. Deployments render APP_ENV=production
      # into .env (deploy/ansible/templates/app.env.j2); local Compose stays on
      # the development default so a fresh checkout still comes up.
      APP_ENV: ${APP_ENV:-development}
      # Fernet key encrypting user API keys and OAuth tokens at rest. Without a
      # line here the value never reaches the container even when it is set in
      # .env, and EncryptedString silently falls back to storing plaintext.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Deprecated name, still forwarded so an existing .env keeps encrypting
      # after an upgrade instead of silently reverting to plaintext (#613).
      STRAVA_ENCRYPTION_KEY: ${STRAVA_ENCRYPTION_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # AI spend controls (#676). Stated here rather than left to the code
      # defaults, because a var absent from this block never reaches the
      # backend at all (#612/#617) — so "the default" would be invisible in
      # the repo and unchangeable without a code edit.
      #
      # Registration is public on this deployment (see the backend-public-https
      # router below), so with the fallback on, every account that signs up
      # spends the owner's provider key. Set this to false to require BYOK.
      # Left at true here only because flipping it changes who can use a
      # running instance, which is a deployment decision, not a code one.
      ALLOW_ADMIN_AI_KEY_FALLBACK: ${ALLOW_ADMIN_AI_KEY_FALLBACK:-true}
      AI_RATE_LIMIT_ENABLED: ${AI_RATE_LIMIT_ENABLED:-true}
      AI_RATE_LIMIT_BURST: ${AI_RATE_LIMIT_BURST:-10}
      AI_RATE_LIMIT_BURST_SECONDS: ${AI_RATE_LIMIT_BURST_SECONDS:-60}
      AI_RATE_LIMIT_SUSTAINED: ${AI_RATE_LIMIT_SUSTAINED:-100}
      AI_RATE_LIMIT_SUSTAINED_SECONDS: ${AI_RATE_LIMIT_SUSTAINED_SECONDS:-3600}
      # 0 disables the budget. A coach message is ~16k tokens (#510/#556).
      AI_TOKEN_BUDGET: ${AI_TOKEN_BUDGET:-0}
      AI_TOKEN_BUDGET_WINDOW_DAYS: ${AI_TOKEN_BUDGET_WINDOW_DAYS:-30}
      # Auth brute-force controls (#682). Listed for the same reason as the
      # block above: a var absent here never reaches the backend, so leaving
      # these to the code defaults would make them invisible and untunable.
      # /admin/login is the one that matters most — it is publicly routed
      # (PathPrefix(/api), no proxy auth) and one password stands between a
      # guesser and every user's email address.
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      LOGIN_RATE_LIMIT_SECONDS: ${LOGIN_RATE_LIMIT_SECONDS:-300}
      LOGIN_RATE_LIMIT_GLOBAL_ATTEMPTS: ${LOGIN_RATE_LIMIT_GLOBAL_ATTEMPTS:-60}
      LOGIN_RATE_LIMIT_GLOBAL_SECONDS: ${LOGIN_RATE_LIMIT_GLOBAL_SECONDS:-60}
      REGISTRATION_RATE_LIMIT_ATTEMPTS: ${REGISTRATION_RATE_LIMIT_ATTEMPTS:-5}
      REGISTRATION_RATE_LIMIT_SECONDS: ${REGISTRATION_RATE_LIMIT_SECONDS:-3600}
      ADMIN_LOGIN_RATE_LIMIT_ATTEMPTS: ${ADMIN_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      ADMIN_LOGIN_RATE_LIMIT_SECONDS: ${ADMIN_LOGIN_RATE_LIMIT_SECONDS:-900}
      # Request body limits (#682).
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-67108864}
      FIT_UPLOAD_MAX_BYTES: ${FIT_UPLOAD_MAX_BYTES:-10485760}
      FIT_UPLOAD_BULK_MAX_FILES: ${FIT_UPLOAD_BULK_MAX_FILES:-25}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SERVER_URL: ${SERVER_URL:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTHELIA_AUTH_ENABLED: ${AUTHELIA_AUTH_ENABLED:-true}
      AUTHELIA_REMOTE_USER_HEADER: ${AUTHELIA_REMOTE_USER_HEADER:-Remote-User}
      AUTHELIA_REMOTE_EMAIL_HEADER: ${AUTHELIA_REMOTE_EMAIL_HEADER:-Remote-Email}
      AUTHELIA_REMOTE_NAME_HEADER: ${AUTHELIA_REMOTE_NAME_HEADER:-Remote-Name}
      AUTHELIA_INTERNAL_URL: ${AUTHELIA_INTERNAL_URL:-http://authelia:9091}
      AUTHELIA_USERS_DB_PATH: ${AUTHELIA_USERS_DB_PATH:-/authelia-config/users_database.yml}
      AUTHELIA_PROXY_SECRET_HEADER: ${AUTHELIA_PROXY_SECRET_HEADER:-X-Authelia-Proxy-Secret}
      # Shared secret the proxy injects (below) to prove a request transited
      # Traefik. When set, the backend only trusts Remote-* headers on requests
      # carrying it — defense-in-depth if the backend is ever reachable directly
      # inside the Docker network (issue #324). Set a strong random value in .env.
      AUTHELIA_PROXY_SHARED_SECRET: ${AUTHELIA_PROXY_SHARED_SECRET:-}
    # Bind to localhost only: the backend must be reached exclusively through
    # Traefik (which applies the Authelia forward-auth middleware below). A
    # public 0.0.0.0 mapping would expose an auth-free path on which clients can
    # forge Remote-* headers (see issue #324).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./authelia:/authelia-config
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-http.rule=(Host(`trainlikea.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.trainlikea\.pro`) || Host(`train-like-a.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.train-like-a\.pro`)) && (PathPrefix(`/api`) || Path(`/healthz`))
      - traefik.http.routers.backend-http.entrypoints=web
      - traefik.http.routers.backend-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.backend-http.service=backend
      - traefik.http.routers.backend-https.rule=(Host(`trainlikea.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.trainlikea\.pro`) || Host(`train-like-a.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.train-like-a\.pro`)) && (PathPrefix(`/api`) || Path(`/healthz`))
      - traefik.http.routers.backend-https.entrypoints=websecure
      - traefik.http.routers.backend-https.tls=true
      - traefik.http.routers.backend-https.tls.certresolver=letsencrypt
      - traefik.http.routers.backend-https.service=backend
      - traefik.http.routers.backend-https.priority=1000
      # The backend authenticates with its own JWT, issued by /api/v1/auth/login
      # and /register which verify credentials against the Authelia
      # users_database.yml user store. Authelia is NOT an SSO forward-auth proxy
      # here, so the backend must NOT be gated behind it (doing so via the
      # auth-request endpoint returns 400 to every request and breaks login).
      # Instead, strip any client-supplied Remote-* identity headers at the proxy
      # so they can never be forged and trusted by the backend (issue #324).
      # An empty customRequestHeaders value removes the header.
      - traefik.http.middlewares.backend-strip-remote.headers.customRequestHeaders.Remote-User=
      - traefik.http.middlewares.backend-strip-remote.headers.customRequestHeaders.Remote-Email=
      - traefik.http.middlewares.backend-strip-remote.headers.customRequestHeaders.Remote-Name=
      - traefik.http.middlewares.backend-strip-remote.headers.customRequestHeaders.Remote-Groups=
      # Prove a request transited this proxy (#682). AUTHELIA_PROXY_SHARED_SECRET
      # was read by the backend and shipped in .env long before anything set the
      # header, so switching it on used to *disable* Authelia header trust
      # silently rather than tighten it — a control that only looked wired.
      # customRequestHeaders overwrites, so a client cannot supply its own
      # value; when the secret is empty the header is removed and the backend
      # check is a documented no-op.
      - traefik.http.middlewares.backend-proxy-secret.headers.customRequestHeaders.${AUTHELIA_PROXY_SECRET_HEADER:-X-Authelia-Proxy-Secret}=${AUTHELIA_PROXY_SHARED_SECRET:-}
      - traefik.http.routers.backend-https.middlewares=backend-strip-remote@docker,backend-proxy-secret@docker,security-headers@docker
      - traefik.http.routers.backend-public-https.rule=(Host(`trainlikea.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.trainlikea\.pro`) || Host(`train-like-a.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.train-like-a\.pro`)) && (Path(`/api/v1/auth/register`) || Path(`/healthz`))
      - traefik.http.routers.backend-public-https.entrypoints=websecure
      - traefik.http.routers.backend-public-https.tls=true
      - traefik.http.routers.backend-public-https.tls.certresolver=letsencrypt
      - traefik.http.routers.backend-public-https.service=backend
      - traefik.http.routers.backend-public-https.priority=3000
      - traefik.http.routers.backend-public-https.middlewares=backend-strip-remote@docker,backend-proxy-secret@docker,security-headers@docker
      - traefik.http.services.backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_AUTHELIA_URL: ${VITE_AUTHELIA_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-http.rule=Host(`trainlikea.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.trainlikea\.pro`) || Host(`train-like-a.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.train-like-a\.pro`)
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.frontend-http.service=frontend
      - traefik.http.routers.frontend-https.rule=Host(`trainlikea.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.trainlikea\.pro`) || Host(`train-like-a.pro`) || HostRegexp(`[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.train-like-a\.pro`)
      - traefik.http.routers.frontend-https.entrypoints=websecure
      - traefik.http.routers.frontend-https.tls=true
      - traefik.http.routers.frontend-https.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-https.service=frontend
      - traefik.http.routers.frontend-https.middlewares=security-headers@docker
      - traefik.http.services.frontend.loadbalancer.server.port=80

  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG: ${X_AUTHELIA_CONFIG:-/config/configuration.yml}
      # No defaults, for the same reason POSTGRES_PASSWORD has none — and a
      # sharper one (#682). These three were `${VAR:-change-this-...}`, and
      # `:-` substitutes on *empty* as well as unset, so a .env line reading
      # `AUTHELIA_SESSION_SECRET=` silently deployed the placeholder. That
      # placeholder lives in a public repository, which makes it a published
      # secret, not a weak one:
      #
      #   - session.secret signs the portal's session cookies
      #   - identity_validation.reset_password.jwt_secret signs password-reset
      #     tokens, and auth.<domain> is publicly routed. Anyone who can mint a
      #     valid reset token can set any user's password without ever
      #     receiving the notification — and since auth_router.login verifies
      #     against the same users_database.yml, that is app account takeover.
      #   - storage.encryption_key encrypts Authelia's own database.
      #
      # Failing at `compose up` is the point: the previous behaviour was to
      # come up healthy and look fine. Generate each with `openssl rand -hex 32`.
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:?must be set - generate with openssl rand -hex 32}"
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET:?must be set - generate with openssl rand -hex 32}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY:?must be set - generate with openssl rand -hex 32}"
    volumes:
      - ./authelia:/config
      - authelia_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia-http.rule=Host(`auth.trainlikea.pro`) || Host(`auth.train-like-a.pro`)
      - traefik.http.routers.authelia-http.entrypoints=web
      - traefik.http.routers.authelia-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.authelia-http.service=authelia
      - traefik.http.routers.authelia-http.priority=1000
      - traefik.http.routers.authelia-https.rule=Host(`auth.trainlikea.pro`) || Host(`auth.train-like-a.pro`)
      - traefik.http.routers.authelia-https.entrypoints=websecure
      - traefik.http.routers.authelia-https.tls=true
      - traefik.http.routers.authelia-https.tls.certresolver=letsencrypt
      - traefik.http.routers.authelia-https.service=authelia
      - traefik.http.routers.authelia-https.priority=1000
      - traefik.http.routers.authelia-https.middlewares=security-headers@docker
      - traefik.http.services.authelia.loadbalancer.server.port=9091

  # --- Monitoring (#549) -----------------------------------------------------
  # Neither service carries Traefik labels and both bind to 127.0.0.1, so
  # nothing here is reachable from the internet. Reach Grafana with an SSH
  # tunnel:
  #
  #     ssh -L 3000:127.0.0.1:3000 root@trainlikea.pro
  #
  # then open http://localhost:3000. A publicly reachable Grafana is a standing
  # scan target, and this deployment has exactly one human who needs it.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to answer "did the bill come down after that change?"
      # (#510) without the volume growing without bound.
      - --storage.tsdb.retention.time=180d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    labels:
      - traefik.enable=false

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      # Only reachable through the SSH tunnel above, so this is a second lock
      # on an already locked door — but a default password on a metrics UI is
      # how those get found, so it stays settable and is documented in
      # .env.example.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls: this instance has no internet-facing purpose.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - traefik.enable=false

volumes:
  postgres_data:
  letsencrypt_data:
  authelia_data:
  prometheus_data:
  grafana_data:
