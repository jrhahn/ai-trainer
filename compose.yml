services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer}
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrainer} -d ${POSTGRES_DB:-aitrainer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitrainer}:${POSTGRES_PASSWORD:-aitrainer}@postgres:5432/${POSTGRES_DB:-aitrainer}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-http.rule=(Host(`trainlikea.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.trainlikea.pro`) || Host(`train-like-a.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.train-like-a.pro`)) && (PathPrefix(`/api`) || Path(`/healthz`))
      - traefik.http.routers.backend-http.entrypoints=web
      - traefik.http.routers.backend-http.middlewares=redirect-to-https@docker
      - traefik.http.routers.backend-https.rule=(Host(`trainlikea.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.trainlikea.pro`) || Host(`train-like-a.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.train-like-a.pro`)) && (PathPrefix(`/api`) || Path(`/healthz`))
      - traefik.http.routers.backend-https.entrypoints=websecure
      - traefik.http.routers.backend-https.tls=true
      - traefik.http.routers.backend-https.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.http.routers.frontend-http.rule=Host(`trainlikea.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.trainlikea.pro`) || Host(`train-like-a.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.train-like-a.pro`)
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.middlewares=redirect-to-https
      - traefik.http.routers.frontend-https.rule=Host(`trainlikea.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.trainlikea.pro`) || Host(`train-like-a.pro`) || HostRegexp(`{subdomain:[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?}.train-like-a.pro`)
      - traefik.http.routers.frontend-https.entrypoints=websecure
      - traefik.http.routers.frontend-https.tls=true
      - traefik.http.routers.frontend-https.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:
  postgres_data:
  letsencrypt_data:
