- name: Deploy AI Trainer to Hetzner
  hosts: production
  become: true
  vars:
    app_dir: /opt/ai-trainer
    debian_apt_mirror: http://deb.debian.org/debian
    debian_security_mirror: http://deb.debian.org/debian-security
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

  tasks:
    - name: Find APT source files
      ansible.builtin.find:
        paths:
          - /etc/apt
        patterns:
          - sources.list
          - "*.list"
          - "*.sources"
        recurse: true
        file_type: file
      register: apt_source_files

    - name: Replace Hetzner package mirror with Debian mirror
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: "http://mirror\\.hetzner\\.com/debian/packages"
        replace: "{{ debian_apt_mirror }}"
      loop: "{{ apt_source_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Replace Hetzner security mirror with Debian security mirror
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: "http://mirror\\.hetzner\\.com/debian/security"
        replace: "{{ debian_security_mirror }}"
      loop: "{{ apt_source_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove conflicting old Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true

    - name: Install APT prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Ensure Docker keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker apt GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker
        update_cache: true

    - name: Install latest Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Sync repository to server
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'GITHUB_WORKSPACE') }}/"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          # .env is rendered below, not committed, so --delete would otherwise
          # remove it on every deploy. That leaves a window in which a running
          # `docker compose` sees no .env and falls back to placeholder
          # credentials; excluding it means the file is only ever replaced
          # in-place by the template task.
          - "--exclude=.env"
          - "--exclude=authelia/users_database.yml"
          - "--exclude=authelia/db.sqlite3"
          - "--exclude=authelia/notification.txt"
          - "--delete"

    - name: Render deployment environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Remove Compose containers with missing image metadata
      ansible.builtin.shell: |
        set -eu
        compose_files="--file compose.yml"
        if [ -n "{{ authelia_notifier_smtp_address | default('') }}" ]; then
          compose_files="$compose_files --file compose.smtp.yml"
        fi

        ids=$(/usr/bin/docker compose --ansi never --project-directory "{{ app_dir }}" $compose_files ps -aq || true)
        removed=0
        for id in $ids; do
          image_id=$(/usr/bin/docker inspect --format='{% raw %}{{.Image}}{% endraw %}' "$id" 2>/dev/null || true)
          if [ -n "$image_id" ] && ! /usr/bin/docker image inspect "$image_id" >/dev/null 2>&1; then
            /usr/bin/docker rm -f "$id" >/dev/null
            removed=$((removed + 1))
          fi
        done
        printf '%s\n' "$removed"
      args:
        executable: /bin/sh
      register: stale_compose_containers
      changed_when: stale_compose_containers.stdout | int > 0

    - name: Build and start Docker services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files: "{{ ['compose.yml'] + (['compose.smtp.yml'] if (authelia_notifier_smtp_address | default('')) else []) }}"
        build: always
        remove_orphans: true
        state: present
