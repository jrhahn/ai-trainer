- name: Deploy AI Trainer to Hetzner
  hosts: production
  become: true
  vars:
    app_dir: /opt/ai-trainer
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

  tasks:
    - name: Remove conflicting old Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true

    - name: Install APT prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Ensure Docker keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker apt GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker
        update_cache: true

    - name: Install latest Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Sync repository to server
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'GITHUB_WORKSPACE') }}/"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=authelia/users_database.yml"
          - "--exclude=authelia/db.sqlite3"
          - "--exclude=authelia/notification.txt"
          - "--delete"

    - name: Render deployment environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Build and start Docker services
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files: "{{ ['compose.yml'] + (['compose.smtp.yml'] if (authelia_notifier_smtp_address | default('')) else []) }}"
        build: always
        remove_orphans: true
        state: present
