server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Defence in depth for #677. The coach's reply is model-authored text
    # rendered as markdown, and a remote reference in it would beacon on render
    # — carrying the athlete's health data off-origin with no click. The
    # component map in AIChat.tsx renders `img`/`a` inert, which is the primary
    # guarantee; this is the layer that survives a future refactor forgetting
    # that, and the one that also covers a compromised dependency in the bundle.
    #
    # `style-src` needs 'unsafe-inline': Tailwind and the icon components set
    # inline styles at runtime. Scripts do not, so `script-src` stays strict.
    # `img-src` keeps 'self' and data: for the app's own assets and inlined
    # icons — neither reaches a third-party host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # From the first ZAP baseline (ai-trainer-ops#32).
    #
    # No popup and no window.opener anywhere in the app — the Strava and
    # intervals.icu connects are full-page navigations — so the opener can be
    # severed and the assets kept to this origin without breaking a flow.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Nothing here uses a camera, microphone, location or payment. The one
    # browser capability in use is clipboard *writing* (recovery codes), which
    # is gated on a user gesture rather than on this header, so it stays out.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
    # Deliberately no Cross-Origin-Embedder-Policy. Its only gain is
    # cross-origin isolation (SharedArrayBuffer, precise timers), which the
    # app does not use, and a mistake in it blanks the whole app in a way no
    # test here would catch.
    server_tokens off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip the identity headers before they reach the backend (#682).
        # nginx forwards client headers verbatim by default, so this location
        # was a second, unfiltered route to backend:8000 — and with
        # AUTHELIA_AUTH_ENABLED a forged `Remote-Email` on that route
        # authenticated as any user without a password. That is issue #324
        # again, and Traefik's backend-strip-remote middleware does not cover
        # it because this path does not go through Traefik's backend router.
        #
        # Today the router priorities (backend 1000/3000 vs the frontend
        # router's length-derived default) mean /api never reaches here at all.
        # That is a routing accident, not a boundary, and it is one label edit
        # away from not being true. An empty value removes the header.
        #
        # Since ai-trainer-ops#34 the backend also refuses to read Remote-* on a
        # request that has not proved it transited the trusted proxy, so this
        # block is defence in depth rather than the only thing in the way. It
        # stays because the proof is a shared secret an operator can configure,
        # and this list holds whether they did or not. The names must match the
        # backend's AUTHELIA_REMOTE_*_HEADER settings;
        # backend/tests/test_remote_user_boundary.py checks them against
        # config.py so the two lists cannot drift apart silently.
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Groups "";
        # Not a client's to send either: it is the proof-of-transit secret the
        # trusted proxy injects. Forwarding a client-supplied one would let this
        # path mint exactly the trust the secret exists to establish.
        proxy_set_header X-Authelia-Proxy-Secret "";

        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
