name: Security

# The boring class of vulnerability, caught automatically (ai-trainer-ops#32):
# known-vulnerable dependencies, what the base images bring along, the static
# classics, and missing headers on what actually ships.
#
# REPORT FIRST, THEN GATE. A scan starts out exiting 0 whatever it finds, and
# writes what it found to the job summary and to an artifact. A gate that is
# red on day one gets switched off — the same rule as the output audit
# (ai-trainer-ops#28). Once a scan's backlog is at zero it becomes a gate, one
# at a time:
#
#   semgrep      gate   (backlog cleared in #762)
#   pip-audit    report; the weekly run fails on a finding (alarm)
#   npm audit    report
#   trivy        report
#   ZAP baseline report
#
# Tools are pinned: Python tools by version, container images by tag *and*
# digest. A scanner runs with the checkout and the built images in reach, which
# is exactly where a hijacked tag would want to be (tj-actions/changed-files
# had every tag rewritten in March 2025). So trivy and ZAP run from images
# pinned by digest rather than from actions referenced by a movable tag.
# Dependabot does not see images referenced inside a workflow, so bumping
# these is manual.

on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    # Weekly, because a new advisory against an unchanged lockfile is the case
    # neither a PR nor a push would ever surface.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on its previous head. Every other
# run (a push to develop, the weekly scan, a manual run) gets a group of its
# own, so it never waits or gets cancelled (ai-trainer-ops#286).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PIP_AUDIT_VERSION: 2.10.1
  SEMGREP_VERSION: 1.179.0
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  # The database compose.yml runs. The backend image ships asyncpg only, so it
  # cannot start on SQLite the way the test suite does.
  POSTGRES_IMAGE: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d

jobs:
  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: pip-audit (backend, from the lockfile)
        id: pip_audit
        working-directory: backend
        run: |
          # Audit what uv.lock resolves to, not what happens to be installed:
          # the lockfile is what the image is built from.
          uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          set +e
          uvx "pip-audit==${PIP_AUDIT_VERSION}" --requirement /tmp/requirements.txt \
            --disable-pip --no-deps --format markdown --output /tmp/pip-audit.md
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # pip-audit writes no file at all when it finds nothing, and "no
          # report" must not read the same as "clean".
          if [ "$status" -eq 0 ] && [ ! -s /tmp/pip-audit.md ]; then
            echo "No known vulnerabilities found." > /tmp/pip-audit.md
          fi
          {
            echo "## pip-audit (backend runtime dependencies)"
            echo
            echo "exit status: \`$status\` (0 = nothing known)"
            echo
            cat /tmp/pip-audit.md 2>/dev/null || echo "_no report written_"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ../security-reports && cp /tmp/pip-audit.md ../security-reports/ 2>/dev/null || true

      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          # Runtime dependencies are what reaches a browser; dev dependencies
          # only reach CI and a developer's machine. Both are reported, the
          # runtime count first because it is the one that matters for users.
          mkdir -p ../security-reports
          npm audit --omit=dev --json > ../security-reports/npm-audit-runtime.json || true
          npm audit --json > ../security-reports/npm-audit-all.json || true
          summarise() {
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const v = (r.metadata && r.metadata.vulnerabilities) || {};
              const keys = ["critical", "high", "moderate", "low", "info"];
              console.log("| " + keys.join(" | ") + " |");
              console.log("|" + keys.map(() => "---").join("|") + "|");
              console.log("| " + keys.map(k => v[k] || 0).join(" | ") + " |");
            ' "$1"
          }
          {
            echo "## npm audit (frontend)"
            echo
            echo "### Runtime dependencies"
            summarise ../security-reports/npm-audit-runtime.json
            echo
            echo "### All dependencies, including dev"
            summarise ../security-reports/npm-audit-all.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: security-reports/
          if-no-files-found: ignore

      # The alarm the owner chose over a gate (ai-trainer-ops#39 Q7): a PR is
      # never failed by an advisory against a lockfile it did not touch, but
      # the weekly run fails on any finding, and GitHub mails a failed
      # scheduled run. After the upload, so the report is always attached.
      - name: Alarm on a pip-audit finding (weekly run only)
        if: github.event_name == 'schedule' && steps.pip_audit.outputs.status != '0'
        run: |
          echo "::error::pip-audit exit status ${{ steps.pip_audit.outputs.status }}: see the job summary and the dependency-audit artifact."
          exit 1

  semgrep:
    # A GATE: any finding fails the job. A false positive is annotated in place
    # with `# nosemgrep: <rule id>` and a reason on the line above, never
    # silenced by excluding a path or a rule.
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'

      - name: semgrep (Python and TypeScript rulesets)
        run: |
          mkdir -p security-reports
          # --metrics=off: this repository is public, but what a scan of it
          # found is nobody else's business before it is fixed.
          uvx "semgrep==${SEMGREP_VERSION}" scan \
            --config p/python --config p/typescript --config p/react \
            --metrics=off \
            --exclude 'backend/tests' --exclude 'frontend/src/**/*.test.ts' \
            --exclude 'frontend/src/**/*.test.tsx' \
            --json --output security-reports/semgrep.json \
            backend frontend/src || true
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json
          try:
              report = json.load(open("security-reports/semgrep.json"))
          except (OSError, ValueError):
              # For a gate, a scan that did not run is not a clean scan.
              print("## semgrep\n\n_no report written — failing_")
              raise SystemExit(1)
          results = report.get("results", [])
          by_severity = collections.Counter(r["extra"].get("severity", "?") for r in results)
          by_rule = collections.Counter(r["check_id"] for r in results)
          print("## semgrep\n")
          print(f"{len(results)} findings, {len(report.get('errors', []))} scan errors\n")
          print("| severity | count |\n|---|---|")
          for severity, count in by_severity.most_common():
              print(f"| {severity} | {count} |")
          print("\n| rule | count |\n|---|---|")
          for rule, count in by_rule.most_common(25):
              print(f"| `{rule}` | {count} |")
          for r in results:
              print(f"- `{r['path']}:{r['start']['line']}` {r['check_id']}")
          # A run can write results: [] and still have failed to apply rules —
          # a rule-fetch or parse error. Those fail the gate like a finding.
          # Warn-level errors (a per-file timeout, of which a clean run has a
          # couple) are listed but do not.
          errors = report.get("errors", [])
          fatal = [e for e in errors if e.get("level") == "error"]
          for e in errors:
              print(f"- {e.get('level')} {e.get('type')}: {str(e.get('message', ''))[:200]}")
          raise SystemExit(1 if results or fatal else 0)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep
          path: security-reports/
          if-no-files-found: ignore

  images:
    name: Images (trivy) and headers (ZAP baseline)
    # Not on pull requests: building and scanning both images takes three and a
    # half minutes, ran 57 times in one day, and reports without gating. A
    # push to develop, the weekly run and a manual one still scan what ships,
    # and the compose smoke in ci.yml builds both images on every PR
    # (ai-trainer-ops#286).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        # Anonymous pulls share a rate limit per runner IP, and it ran out
        # (ai-trainer-ops#32). Fork PRs get no secrets: they skip this and pull
        # anonymously, as before.
        if: env.HAS_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build the images the deployment ships
        run: |
          docker build -t ai-trainer-backend:scan backend
          docker build -t ai-trainer-frontend:scan frontend

      - name: trivy (both images)
        run: |
          mkdir -p security-reports
          for image in backend frontend; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/security-reports:/reports" \
              "$TRIVY_IMAGE" image --quiet --exit-code 0 \
              --severity CRITICAL,HIGH,MEDIUM \
              --format json --output "/reports/trivy-${image}.json" \
              "ai-trainer-${image}:scan" || true
          done
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json
          print("## trivy\n")
          missing = []
          for image in ("backend", "frontend"):
              try:
                  report = json.load(open(f"security-reports/trivy-{image}.json"))
              except (OSError, ValueError):
                  # Findings are reported, not gated; a scan that wrote no
                  # report fails, because it is not a clean scan (ai-trainer-ops#286).
                  print(f"### {image}\n\n_no report written — failing_\n")
                  missing.append(image)
                  continue
              counts = collections.Counter()
              fixable = collections.Counter()
              for result in report.get("Results") or []:
                  for vuln in result.get("Vulnerabilities") or []:
                      counts[vuln["Severity"]] += 1
                      if vuln.get("FixedVersion"):
                          fixable[vuln["Severity"]] += 1
              print(f"### {image}\n")
              print("| severity | found | fix available |\n|---|---|---|")
              for severity in ("CRITICAL", "HIGH", "MEDIUM"):
                  print(f"| {severity} | {counts[severity]} | {fixable[severity]} |")
              print()
          raise SystemExit(1 if missing else 0)
          EOF

      - name: Start both images
        run: |
          # Throwaway database and secrets: the scan is of what the app answers
          # on the wire, not of a deployment.
          docker network create scan
          docker run -d --name db --network scan \
            -e POSTGRES_DB=aitrainer -e POSTGRES_USER=aitrainer \
            -e POSTGRES_PASSWORD=zap-baseline-only \
            "$POSTGRES_IMAGE"
          # Over TCP, not the socket: the image's first-boot init runs a
          # temporary server on the socket only, so a socket check can pass
          # before db:5432 accepts the backend — and entrypoint.sh does not
          # retry its migration.
          db_up=no
          for _ in $(seq 1 45); do
            if docker exec db pg_isready -h 127.0.0.1 -U aitrainer -d aitrainer >/dev/null 2>&1; then
              db_up=yes; break
            fi
            sleep 2
          done
          echo "- database came up: **$db_up**" >> "$GITHUB_STEP_SUMMARY"
          # The published port is what makes localhost:8000 reachable for ZAP,
          # which runs with --network host rather than on the scan network.
          docker run -d --name backend --network scan -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://aitrainer:zap-baseline-only@db:5432/aitrainer \
            -e JWT_SECRET=zap-baseline-secret-that-is-at-least-32-bytes \
            -e APP_ENV=test \
            ai-trainer-backend:scan
          docker run -d --name frontend -p 8080:80 ai-trainer-frontend:scan
          # A target that never answers is reported, not silently skipped:
          # "no findings" and "never scanned" must not look alike.
          for target in http://localhost:8000/healthz http://localhost:8080/; do
            up=no
            for _ in $(seq 1 45); do
              if curl -fsS -o /dev/null "$target"; then up=yes; break; fi
              sleep 2
            done
            echo "- \`$target\` came up: **$up**" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: ZAP baseline (passive only)
        run: |
          # Baseline is passive: it spiders and reads responses, it attacks
          # nothing. -I keeps warnings from failing the step; the `|| true`
          # covers the rest, because this job reports and does not gate.
          #
          # The frontend container is what ships — nginx with this repository's
          # nginx.conf — so its headers are the real ones. The backend is
          # scanned directly; in production Traefik adds to its headers, so a
          # header reported missing there may still be set one hop out.
          chmod a+w security-reports
          for target in frontend:http://localhost:8080 backend:http://localhost:8000; do
            name="${target%%:*}"
            url="${target#*:}"
            docker run --rm --network host \
              -v "$PWD/security-reports:/zap/wrk:rw" \
              "$ZAP_IMAGE" zap-baseline.py -t "$url" -I \
              -r "zap-${name}.html" -J "zap-${name}.json" || true
          done
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          risk = {"3": "High", "2": "Medium", "1": "Low", "0": "Info"}
          print("## ZAP baseline\n")
          missing = []
          for name in ("frontend", "backend"):
              try:
                  report = json.load(open(f"security-reports/zap-{name}.json"))
              except (OSError, ValueError):
                  # As for trivy: no report is a failure, not a clean scan.
                  print(f"### {name}\n\n_no report written — failing_\n")
                  missing.append(name)
                  continue
              alerts = [a for site in report.get("site", []) for a in site.get("alerts", [])]
              print(f"### {name}\n")
              print("| risk | alert | instances |\n|---|---|---|")
              for alert in sorted(alerts, key=lambda a: -int(a.get("riskcode", 0))):
                  print(
                      f"| {risk.get(str(alert.get('riskcode')), '?')} "
                      f"| {alert.get('alert')} | {len(alert.get('instances', []))} |"
                  )
              print()
          raise SystemExit(1 if missing else 0)
          EOF

      - name: Container logs (when a target did not come up)
        if: always()
        run: |
          docker logs backend 2>&1 | tail -40 || true
          docker logs db 2>&1 | tail -10 || true
          docker logs frontend 2>&1 | tail -20 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: images-and-headers
          path: security-reports/
          if-no-files-found: ignore
