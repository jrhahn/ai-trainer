name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  backend:
    name: Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      STRAVA_CLIENT_ID: ci-strava-client
      STRAVA_CLIENT_SECRET: ci-strava-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key
      # tests/test_proxy_pair_smuggling.py runs the production Traefik image in
      # front of uvicorn (ai-trainer-ops#34). Locally it skips without Docker;
      # here a missing Docker must fail it rather than skip it silently.
      REQUIRE_PROXY_PAIR: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=88

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  policy-guards:
    name: Policy Constant Guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Deliberately its own job rather than part of the pytest run: it costs
    # about a suite run of its own, and a green suite is not evidence that the
    # numbers the suite ran against are load-bearing (#600).
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      STRAVA_CLIENT_ID: ci-strava-client
      STRAVA_CLIENT_SECRET: ci-strava-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Check that the numbers we decide with are load-bearing
        run: uv run python scripts/check_policy_guards.py

  e2e:
    name: E2E Smoke (register → onboarding)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the lockfile, not on the browser revision Playwright wants:
      # the revision is not available before `npm ci`, and a lockfile change is
      # the only thing that can move it. So any dependency bump misses the cache
      # and re-downloads ~120 MB — safe, and slower than it needs to be. The
      # install step runs either way and re-validates whatever was restored.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Each config starts its own backend and its own production build of the
      # frontend, so there is nothing to orchestrate here.
      #
      # Two stacks, and they cannot be one (ai-trainer-ops#46). The keyless one
      # has no provider key, which is the only way the #41 dead end is
      # reproducible in a browser; the stubbed one turns AI_STUB_PROVIDER on so
      # a dashboard with a plan can be reached at all. The stub is chosen before
      # the key checks, so a single process cannot serve both.
      #
      # Run as separate steps rather than `test:e2e:all`, so the job's log says
      # which stack failed without anyone opening the report.
      - name: Smoke test — no AI key configured
        working-directory: frontend
        run: npm run test:e2e

      - name: Smoke test — stubbed provider
        working-directory: frontend
        run: npm run test:e2e:stub

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  integration:
    name: Integration Tests (Frontend ↔ Backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run integration tests
        working-directory: frontend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./integration-test.db
          JWT_SECRET: ci-integration-secret-that-is-at-least-32-bytes
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: '60'
          STRAVA_CLIENT_ID: ci-strava-id
          STRAVA_CLIENT_SECRET: ci-strava-secret
          FRONTEND_URL: http://localhost:5173
          OPENAI_API_KEY: ci-openai-key
          GEMINI_API_KEY: ci-gemini-key
          APP_ENV: test
          AUTHELIA_AUTH_ENABLED: 'false'
        run: npm run test:integration
