name: CI

on:
  # A push runs CI only on develop. A pull request gets its run from the
  # pull_request event, so a push to its branch no longer runs everything
  # twice (ai-trainer-ops#286).
  push:
    branches: [develop]
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A new push to a pull request cancels the run on its previous head. A push to
# develop gets a group of its own, so its run never waits or gets cancelled: the
# deploy ships a develop commit only once that run has passed
# (ai-trainer-ops#286).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job has a timeout, so a hung one ends after minutes rather than after
# GitHub's default of six hours (ai-trainer-ops#286).
jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  backend:
    name: Backend Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      # No DATABASE_URL: tests/conftest.py gives every pytest-xdist worker a
      # database of its own, which one URL for all four would undo (ai-trainer-ops#287).
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      STRAVA_CLIENT_ID: ci-strava-client
      STRAVA_CLIENT_SECRET: ci-strava-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key
      # tests/test_proxy_pair_smuggling.py runs the production Traefik image in
      # front of uvicorn (ai-trainer-ops#34). Locally it skips without Docker;
      # here a missing Docker must fail it rather than skip it silently.
      REQUIRE_PROXY_PAIR: '1'
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Log in to Docker Hub
        # Anonymous pulls share a rate limit per runner IP, and it ran out
        # (ai-trainer-ops#32). Fork PRs get no secrets: they skip this and pull
        # anonymously, as before.
        if: env.HAS_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Run pytest
        # Four workers on the runner's four cores, a test file per worker at a
        # time (ai-trainer-ops#287). The 25 slowest tests are listed at the end,
        # so the next one that drags shows up in the log rather than in the wait.
        run: uv run pytest -n 4 --dist loadfile --durations=25 --cov --cov-report=xml --cov-fail-under=88

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  policy-guards:
    name: Policy Constant Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Deliberately its own job rather than part of the pytest run: it costs
    # about a suite run of its own, and a green suite is not evidence that the
    # numbers the suite ran against are load-bearing (#600).
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      STRAVA_CLIENT_ID: ci-strava-client
      STRAVA_CLIENT_SECRET: ci-strava-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Check that the numbers we decide with are load-bearing
        run: uv run python scripts/check_policy_guards.py

  e2e:
    name: E2E Smoke (register → onboarding)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One retry on a push to develop only (ai-trainer-ops#291): a flake there
      # froze the deploy. Pull requests keep none, so a flake stays visible
      # where it can still be fixed.
      E2E_RETRIES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Keyed on the lockfile, not on the browser revision Playwright wants:
      # the revision is not available before `npm ci`, and a lockfile change is
      # the only thing that can move it. So any dependency bump misses the cache
      # and re-downloads ~120 MB — safe, and slower than it needs to be. The
      # install step runs either way and re-validates whatever was restored.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Each config starts its own backend and its own production build of the
      # frontend, so there is nothing to orchestrate here.
      #
      # Two stacks, and they cannot be one (ai-trainer-ops#46). The keyless one
      # has no provider key, which is the only way the #41 dead end is
      # reproducible in a browser; the stubbed one turns AI_STUB_PROVIDER on so
      # a dashboard with a plan can be reached at all. The stub is chosen before
      # the key checks, so a single process cannot serve both.
      #
      # Run as separate steps rather than `test:e2e:all`, so the job's log says
      # which stack failed without anyone opening the report.
      - name: Smoke test — no AI key configured
        working-directory: frontend
        run: npm run test:e2e

      - name: Smoke test — stubbed provider
        working-directory: frontend
        run: npm run test:e2e:stub

      # Always, not only on failure (ai-trainer-ops#46). A report that exists
      # only when something broke cannot be used to look at what the product
      # currently does, which is the other half of what these specs are for.
      # `!cancelled()` rather than `always()`: a cancelled run has nothing
      # worth keeping and the upload would just slow the cancel down.
      - name: Upload the Playwright reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report-keyless/
            frontend/playwright-report-stubbed/
            frontend/test-results-keyless/
            frontend/test-results-stubbed/
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: Integration Tests (Frontend ↔ Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The frontend's API types against the backend's schema (ai-trainer-ops#276):
      # a schema change without `npm run types:api` fails here.
      - name: Check the generated API types
        working-directory: frontend
        run: npm run types:api:check

      - name: Run integration tests
        working-directory: frontend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./integration-test.db
          JWT_SECRET: ci-integration-secret-that-is-at-least-32-bytes
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: '60'
          STRAVA_CLIENT_ID: ci-strava-id
          STRAVA_CLIENT_SECRET: ci-strava-secret
          FRONTEND_URL: http://localhost:5173
          OPENAI_API_KEY: ci-openai-key
          GEMINI_API_KEY: ci-gemini-key
          APP_ENV: test
          AUTHELIA_AUTH_ENABLED: 'false'
        run: npm run test:integration

  # The stack as compose.yml builds it: images, Postgres, Authelia and the user
  # store on a bind mount, with production sign-up settings. The jobs above
  # leave that layer out, and both "login down for everyone" incidents were in
  # it (ai-trainer-ops#140). The ops repository deploys a develop commit only
  # once this whole workflow has passed on it.
  compose-smoke:
    name: Compose stack signs in
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build the stack, register by invitation and sign in
        run: python3 scripts/compose_smoke.py
