name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      JWT_SECRET: ci-test-secret-that-is-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 10080
      STRAVA_CLIENT_ID: ci-strava-client
      STRAVA_CLIENT_SECRET: ci-strava-secret
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      OPENAI_API_KEY: ci-openai-key
      GEMINI_API_KEY: ci-gemini-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest --cov --cov-report=xml
