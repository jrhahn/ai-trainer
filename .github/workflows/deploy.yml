name: Deploy

on:
  # Manual dispatch stays available so a deploy can be re-triggered from here
  # without opening the ops repository.
  workflow_dispatch:
  push:
    branches:
      # Only the default branch deploys. This was briefly '**', which meant every
      # feature-branch push ran the playbook against the production host with
      # DEPLOY_BRANCH=<that branch> — so opening a PR shipped it to prod.
      - develop

permissions:
  contents: read

jobs:
  # The deploy itself lives in the private jrhahn/ai-trainer-ops repository
  # (#699). This repository is public, so it is the wrong place to keep the
  # production secrets, the host address and the SSH key — and it no longer
  # holds any of them.
  #
  # The dispatch travels one way, public -> ops, and carries nothing but a SHA.
  # The ops workflow checks this repository out with no token, because it is
  # public, so nothing here can read anything there.
  #
  # What still lives here, deliberately, is the *contract*:
  # `deploy/forwarded-vars.yml` says which inputs exist and what their absence
  # means, `deploy/render_extra_vars.py` applies it, and
  # `backend/tests/test_deploy_wiring.py` checks both against
  # `deploy/ansible/templates/app.env.j2` on every PR. Moving the deploy out
  # must not move that guard somewhere nobody reviews (#617, #684, #694, #700).
  dispatch:
    name: Trigger ops deploy
    runs-on: ubuntu-latest
    # Required, and easy to miss: OPS_DISPATCH_TOKEN is an *environment* secret,
    # and a job that does not declare the environment sees environment secrets
    # as empty rather than erroring. Without this line the token read as "" —
    # which, while a fallback deploy job still existed here, silently deployed
    # over the old path and reported success (#700).
    environment: production
    steps:
      - name: Dispatch to ai-trainer-ops
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          # There is no fallback path any more, so failing loudly here is the
          # whole safety net: an unreadable token must stop the deploy, not
          # quietly route it somewhere else.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OPS_DISPATCH_TOKEN is empty. It is a secret on the" \
                 "'production' environment — check it is set there, and that" \
                 "this job still declares 'environment: production'."
            exit 1
          fi
          gh api repos/jrhahn/ai-trainer-ops/dispatches \
            -f event_type=deploy-develop \
            -F client_payload[sha]="$GITHUB_SHA"
          echo "Dispatched $GITHUB_SHA. The deploy runs in jrhahn/ai-trainer-ops."
