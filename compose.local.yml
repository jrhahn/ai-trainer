# Local replica of the production stack, for prompt/LLM iteration and for
# rehearsing migrations against realistic data.
#
#   docker compose -f compose.local.yml up -d --build
#   ./scripts/clone-prod.sh
#
# Deliberately omits traefik and authelia. Local login uses the backend's own
# password auth (AUTHELIA_AUTH_ENABLED=false -> auth_router.py:193 verifies
# against users.hashed_password), so there is no proxy needed to terminate TLS
# or inject Remote-* headers.
#
# STRAVA_ENCRYPTION_KEY is intentionally left unset. Without it the cloned
# OAuth tokens and BYOK keys cannot be decrypted, so this stack physically
# cannot reach Strava/intervals.icu or spend the production API keys.
# APP_ENV=development waives the key requirement (config.py:86).
#
# Separate project name and volume so this can never touch a prod-shaped
# `docker compose up` on the same machine.
name: aitrainer-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer}
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer}
    # 5433 on the host so it cannot collide with a system postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitrainer} -d ${POSTGRES_DB:-aitrainer}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aitrainer}:${POSTGRES_PASSWORD:-aitrainer}@postgres:5432/${POSTGRES_DB:-aitrainer}
      AUTHELIA_AUTH_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-local-development-only}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      # Your own keys for local AI calls. The cloned BYOK columns are wiped by
      # clone-prod.sh, so requests fall back to these
      # (allow_admin_ai_key_fallback defaults True).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET / STRAVA_ENCRYPTION_KEY are
      # deliberately absent — see header.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8000
        VITE_AUTHELIA_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data_local:
