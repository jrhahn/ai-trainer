apiVersion: 1

providers:
  - name: ai-trainer
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: the file in
    # the repo is the source of truth, so an edit made in the browser cannot
    # quietly become the thing nobody can reproduce.
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
