[project]
name = "ai-trainer-backend"
version = "0.83.1"
description = "AI Trainer backend – auth, user data, AI proxy, Strava OAuth"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "email-validator>=2.2.0",
    "python-dotenv==1.2.4",
    "uvicorn[standard]==0.54.0",
    # database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # auth
    "argon2-cffi>=25.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    # TOTP second factor (#688). qrcode renders the enrollment QR as an SVG on
    # the server, which keeps a JS library — and a CSP exception for it — out of
    # the frontend entirely.
    "pyotp>=2.9.0",
    "qrcode>=8.0",
    # AI
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "json-repair>=0.5.0",
    # RAG
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
    # .fit file parsing
    "fitparse>=1.2.0",
    "python-multipart>=0.0.22",
    # metrics exposition (#549)
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    # Property-based testing for the plan gates: the example tests cover the
    # cases we thought of, these cover the ones we did not.
    "hypothesis>=6.100.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*", "scripts/*"]
concurrency = ["greenlet"]

[tool.coverage.report]
# Coverage floor — pytest --cov fails below this. Set a few points below the
# current level (~90%) as a ratchet; raise as coverage grows.
fail_under = 88
