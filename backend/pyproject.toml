[project]
name = "ai-trainer-backend"
version = "0.2.0"
description = "AI Trainer backend – auth, user data, AI proxy, Strava OAuth"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.3",
    "httpx==0.28.1",
    "email-validator>=2.2.0",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.44.0",
    # database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # auth
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0",
    # AI
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "json-repair>=0.5.0",
    # RAG
    "pgvector>=0.3.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*"]

