theme: auto

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: replace-in-env

authentication_backend:
  # The reset flow was the sharp end of #682: auth.<domain> is publicly routed,
  # and while the reset JWT was signed with a placeholder published in this
  # repo, anyone could mint a valid reset token for any address, set that
  # user's password, and then log in to the app itself — auth_router.login
  # verifies against this same users_database.yml.
  #
  # Strong secrets close that. This closes it a second way, at no cost: the
  # notifier here writes to /data/notification.txt rather than sending mail, so
  # self-service reset never worked for a user anyway. An operator resets a
  # password by editing users_database.yml.
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: true

password_policy:
  standard:
    enabled: true
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: true

# ---------------------------------------------------------------------------
# INERT IN THIS DEPLOYMENT. Nothing below this line is enforced.
#
# access_control is evaluated by Authelia when a request reaches its authz
# endpoint — via the forward-auth middlewares in compose.yml. Those middlewares
# are defined but attached to no router, so no request ever arrives and none of
# these rules run. `default_policy: deny` in particular reads like a locked
# door; it guards a door nobody walks through.
#
# Authelia's role here is the *user store*: auth_router reads
# users_database.yml directly and the app issues its own JWT. Access control
# for /api lives in that JWT and in the per-route dependencies, not here. See
# issue #324 for why putting the backend behind forward-auth is not a
# straightforward switch, and #688 for why TOTP configured here would likewise
# have no effect on app login.
#
# Kept so the policy is ready if this becomes a forward-auth deployment.
# ---------------------------------------------------------------------------
access_control:
  default_policy: deny
  rules:
    - domain:
        - trainlikea.pro
        - '*.trainlikea.pro'
        - train-like-a.pro
        - '*.train-like-a.pro'
      methods:
        - OPTIONS
      policy: bypass
    - domain:
        - trainlikea.pro
        - '*.trainlikea.pro'
        - train-like-a.pro
        - '*.train-like-a.pro'
      policy: one_factor

session:
  secret: replace-in-env
  name: authelia_session
  same_site: lax
  expiration: 12h
  inactivity: 45m
  remember_me: 60d
  cookies:
    - domain: trainlikea.pro
      authelia_url: https://auth.trainlikea.pro
      default_redirection_url: https://trainlikea.pro
    - domain: train-like-a.pro
      authelia_url: https://auth.train-like-a.pro
      default_redirection_url: https://train-like-a.pro

storage:
  encryption_key: replace-in-env
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
