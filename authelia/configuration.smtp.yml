theme: auto

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: replace-in-env

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: true

password_policy:
  standard:
    enabled: true
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_number: true
    require_special: true

access_control:
  default_policy: deny
  rules:
    - domain:
        - trainlikea.pro
        - '*.trainlikea.pro'
        - train-like-a.pro
        - '*.train-like-a.pro'
      methods:
        - OPTIONS
      policy: bypass
    - domain:
        - trainlikea.pro
        - '*.trainlikea.pro'
        - train-like-a.pro
        - '*.train-like-a.pro'
      policy: one_factor

session:
  secret: replace-in-env
  name: authelia_session
  same_site: lax
  expiration: 12h
  inactivity: 45m
  remember_me: 60d
  cookies:
    - domain: trainlikea.pro
      authelia_url: https://auth.trainlikea.pro
      default_redirection_url: https://trainlikea.pro
    - domain: train-like-a.pro
      authelia_url: https://auth.train-like-a.pro
      default_redirection_url: https://train-like-a.pro

storage:
  encryption_key: replace-in-env
  local:
    path: /data/db.sqlite3

notifier:
  smtp:
    address: submission://smtp.example.com:587
    username: smtp-user
    password: replace-in-env
    sender: Train Like a Pro <no-reply@trainlikea.pro>
    identifier: trainlikea.pro
    subject: "[Train Like a Pro] {title}"
    startup_check_address: admin@trainlikea.pro
