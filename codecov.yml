# Codecov configuration — PR-level coverage enforcement.
# Complements the hard CI floors (vitest `thresholds` + pytest `--cov-fail-under`).
coverage:
  status:
    project:
      default:
        # Don't fail the whole project on tiny fluctuations, but block real drops.
        target: auto
        threshold: 1%
      backend:
        flags: [backend]
        target: 88%
        threshold: 1%
      frontend:
        flags: [frontend]
        target: 88%
        threshold: 1%
    patch:
      # New/changed code on a PR must be well covered.
      default:
        target: 85%
        threshold: 5%

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  # Only when coverage moved: a comment on every PR also started a Claude
  # workflow run for nothing each time (ai-trainer-ops#286).
  require_changes: true
